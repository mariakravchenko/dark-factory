# QA role definition (ROLE-04). This phase (04-03) ships it as the fourth and
# final shipped pipeline role: inputs declares acceptance_criteria.json (BA's
# output, two roles earlier) and implementation_summary.json (DEVELOPMENT's
# output, the role immediately prior) -- proving selection is by declared
# filename, not pipeline adjacency.
name: QA
# 08-04 (ROADMAP SC2): QA runs on Hermes -- WORK-09's role-reassignment proof.
worker: hermes
instructions: ../instructions/qa.md

# Phase 6 (plan 06-01, D-16): a deliberate permission expansion resolving
# the discrepancy 06-RESEARCH.md Open Question 1 surfaced -- ROADMAP Phase 6
# SC1 states verbatim that QA can write tests and shell but cannot publish,
# and QA already carried write_scope: ["tests/**"] below with no capability
# behind it. `repo.write` remains absent: QA writes tests, never production
# source, and that absence is the "cannot publish" half of SC1.
tools:
  [
    repo.read,
    repo.search,
    repo.write_tests,
    shell.execute,
    artifacts.read,
    artifacts.write,
  ]
# write_scope (Phase 5, ROLE-05) is now enforced: any changed path outside
# these patterns is reverted and fails the role (D-12, D-13). QA may write
# only under tests/ -- fixtures and test utilities, never production code.
permissions:
  write_scope: ["tests/**"]

# WR-01 (04-REVIEW): context assembly and artifact persistence are
# unconditional orchestrator behaviour (orchestrator/runner.py), not
# something a role opts into -- prepare_role_context / store_role_artifacts
# used to be listed here but named no-op stubs that never gated either one.
# collect_test_results stays: it is a genuine Phase 9 (GATE-04) placeholder
# with no unconditional equivalent elsewhere yet. See
# src/dark_factory/actions/builtins.py's module docstring.
# ensure_clean_worktree (Phase 5, GIT-01) is different: unlike context
# assembly and artifact persistence it opens no session, so it is
# legitimately a role-configurable hook and is listed here on every role
# deliberately -- a role YAML that omitted it would forgo recovery.
# collect_diff (plan 05-03, D-10) is real and git-only too. DEVELOPMENT and
# QA are the two roles that can change repository source, so only they list
# it -- BA and ARCHITECTURE are read-only with respect to source, and a
# patch file from either would record only earlier roles' work under a
# misleading attribution. collect_test_results stays first in this list.
before: [ensure_clean_worktree]
after: [collect_test_results, collect_diff]

inputs: [acceptance_criteria.json, implementation_summary.json]
outputs: [test_report.json, verdict.json]
examples: []
