# Architect role definition (CFG-02 / CFG-03, ROLE-02). Editing this file
# changes the resolved role in the next run's snapshot with no Python change.
name: ARCHITECTURE
worker: fake
instructions: ../instructions/architecture.md

# tools / permissions are stored in the snapshot this phase, not enforced
# (tool grants -> Phase 6 TOOL-03; write_scope -> Phase 5 ROLE-05).
tools: [repo.read, repo.search, artifacts.read, artifacts.write]
permissions:
  write_scope: []

before: [prepare_role_context]
after: [store_role_artifacts]

inputs: [acceptance_criteria.json]
outputs: [design.md, constraints.json]
examples: []
