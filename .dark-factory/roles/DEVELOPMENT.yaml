# Developer role definition (CFG-02 / CFG-03, ROLE-03). Editing this file
# changes the resolved role in the next run's snapshot with no Python change.
name: DEVELOPMENT
worker: fake
instructions: ../instructions/development.md

# tools / permissions are stored in the snapshot this phase, not enforced
# (tool grants -> Phase 6 TOOL-03; write_scope -> Phase 5 ROLE-05). Grants the
# existing roles' read/artifact tools plus the write-capable ones ROLE-03
# names (repo.write, repo.write_tests, shell.execute) -- Phase 4 has no git
# worktree and no real worker, so nothing here is exercised yet; see
# A-04-03 in 04-03-PLAN.md for the explicit write-scope carve-out.
tools:
  [
    repo.read,
    repo.search,
    repo.write,
    repo.write_tests,
    shell.execute,
    artifacts.read,
    artifacts.write,
  ]
permissions:
  write_scope: []

# WR-01 (04-REVIEW): context assembly and artifact persistence are
# unconditional orchestrator behaviour (orchestrator/runner.py), not
# something a role opts into -- prepare_role_context / store_role_artifacts
# used to be listed here but named no-op stubs that never gated either one.
# See src/dark_factory/actions/builtins.py's module docstring.
# ensure_clean_worktree (Phase 5, GIT-01) is different: unlike context
# assembly and artifact persistence it opens no session, so it is
# legitimately a role-configurable hook and is listed here on every role
# deliberately -- a role YAML that omitted it would forgo recovery.
# collect_diff (plan 05-03, D-10) is real and git-only too. DEVELOPMENT and
# QA are the two roles that can change repository source, so only they list
# it -- BA and ARCHITECTURE are read-only with respect to source, and a
# patch file from either would record only earlier roles' work under a
# misleading attribution.
before: [ensure_clean_worktree]
after: [collect_diff]

inputs: [design.md, constraints.json]
outputs: [implementation_summary.json]
examples: []
