[project]
name = "dark-factory"
version = "0.1.0"
description = "Durable software-delivery orchestration platform for AI engineering agents"
readme = "README.md"
authors = [
    { name = "Maryia Krauchanka", email = "krauchankamaryia@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.19,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "typer>=0.27,<1",
    "structlog>=25,<27",
    "tenacity>=9,<10",
    "pyyaml>=6,<7",
]

[project.scripts]
dark-factory = "dark_factory.cli:app"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "testcontainers[postgres]>=4.15,<5",
    "pytest-postgresql>=9,<10",
    "polyfactory>=3,<4",
    "time-machine>=3,<4",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dark_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-function tests with no database or I/O",
    "db: tests that require a reachable PostgreSQL 17 instance",
    "integration: end-to-end tests that drive the CLI as a subprocess",
    "contract: shared CodingWorker contract suite parametrized over worker adapters",
]

[tool.ruff]
target-version = "py312"
# GSD planning prose and vendored tooling are not project source. ruff 0.16+
# reformats fenced Python blocks inside Markdown, which would rewrite historical
# planning/research documents; keep the format/lint gates scoped to real code.
extend-exclude = [".planning", ".claude"]

[tool.ruff.lint]
select = ["I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
