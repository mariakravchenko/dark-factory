[project]
name = "dark-factory"
version = "0.1.0"
description = "Durable software-delivery orchestration platform for AI engineering agents"
readme = "README.md"
authors = [
    { name = "Maryia Krauchanka", email = "krauchankamaryia@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.19,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "typer>=0.27,<1",
    "structlog>=25,<27",
    "tenacity>=9,<10",
    "pyyaml>=6,<7",
    "githubkit>=0.16,<0.17",
]

[project.scripts]
dark-factory = "dark_factory.cli:app"

# The orchestrator must never import `mcp` on a core path (TOOL-05, D-13):
# uninstalling this extra must leave the core fully functional, not merely
# import-graph-clean. `tests/unit/test_no_mcp_import_in_core.py` is the
# structural proof that no module reachable from the core roots imports it.
#
# Same rule applies to `webhook` (GIT-06/D-01): the orchestrator core must
# never import the webhook receiver on a core path, so uninstalling this
# extra leaves the core fully functional. Starlette is the smallest surface
# that still gives exact raw-request-body access (`await request.body()`),
# which the webhook signature check requires because the HMAC covers the
# exact bytes GitHub sent and a framework that hands back a re-serialised
# parse silently breaks verification; it ships an in-process `TestClient`
# built on `httpx`, which `githubkit` already pulls in, so the signature
# tests need no additional test dependency.
[project.optional-dependencies]
mcp = [
    "mcp>=2.2,<3",
]
webhook = [
    "starlette>=0.42,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "testcontainers[postgres]>=4.15,<5",
    "pytest-postgresql>=9,<10",
    "polyfactory>=3,<4",
    "time-machine>=3,<4",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dark_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-function tests with no database or I/O",
    "db: tests that require a reachable PostgreSQL 17 instance",
    "integration: end-to-end tests that drive the CLI as a subprocess",
    "contract: shared CodingWorker contract suite parametrized over worker adapters",
]

[tool.ruff]
target-version = "py312"
# GSD planning prose and vendored tooling are not project source. ruff 0.16+
# reformats fenced Python blocks inside Markdown, which would rewrite historical
# planning/research documents; keep the format/lint gates scoped to real code.
extend-exclude = [".planning", ".claude"]

[tool.ruff.lint]
select = ["I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
